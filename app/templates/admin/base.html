
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#172b3a">

    <title>{% block title %}FloodShield Admin{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/admin.css') }}"
    >

    {% block extra_css %}{% endblock %}
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark fs-navbar shadow-sm">
        <div class="container-fluid px-3 px-lg-4">
            <a
                class="navbar-brand fw-bold"
                href="{{ url_for('admin_pages.admin_dashboard_page') }}"
            >
                FloodShield
                <span class="badge bg-info text-dark ms-2">ADMIN</span>
            </a>

            <div class="d-flex align-items-center gap-3">
                {% if admin is defined %}
                    <span class="text-white d-none d-sm-inline">
                        {{ admin.name }}
                    </span>

                    <button
                        type="button"
                        class="btn btn-outline-light btn-sm"
                        id="logoutButton"
                    >
                        Logout
                    </button>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container-fluid px-3 px-lg-4 py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script
        src="{{ url_for('static', filename='js/citizen-management.js') }}"
        defer
    ></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
