
{% extends "admin/base.html" %}

{% block title %}Administrator Login | FloodShield{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="card login-card shadow-lg border-0">
        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                <div class="login-icon mb-3">🌊</div>
                <h2 class="fw-bold">FloodShield</h2>
                <p class="text-muted mb-0">Administrator Portal</p>
            </div>

            <div id="loginError" class="alert alert-danger d-none" role="alert"></div>

            <form id="loginForm">

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">
                        Email address
                    </label>

                    <input
                        type="email"
                        class="form-control form-control-lg"
                        id="email"
                        name="email"
                        maxlength="120"
                        autocomplete="username"
                        placeholder="Enter administrator email"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control form-control-lg"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn btn-primary btn-lg w-100"
                    id="loginButton"
                >
                    Sign In
                </button>

            </form>

            <p class="text-muted text-center small mt-4 mb-0">
                Authorized administrator access only.
            </p>

        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById("loginForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errorBox = document.getElementById("loginError");
    const loginButton = document.getElementById("loginButton");

    errorBox.textContent = "";
    errorBox.classList.add("d-none");

    loginButton.disabled = true;
    loginButton.textContent = "Signing in...";

    try {
        const response = await fetch("/admin/session", {
            method: "POST",
            credentials: "same-origin",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.message || "Unable to sign in.");
        }

        window.location.assign("/admin");

    } catch (error) {
        errorBox.textContent = error.message || "A connection error occurred.";
        errorBox.classList.remove("d-none");
    } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Sign In";
    }
});
</script>
{% endblock %}
